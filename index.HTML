<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema Financeiro</title>
  <style>
    :root {
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --primary: #2563eb;
      --success: #16a34a;
      --danger: #dc2626;
      --text: #1f2937;
      --text-light: #6b7280;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text);
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      background-color: var(--card-bg);
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
    }

    /* Navegação por Abas */
    .tabs {
      display: flex;
      border-bottom: 1px solid #e5e7eb;
      background: #f8fafc;
    }

    .tab-btn {
      flex: 1;
      padding: 15px;
      border: none;
      background: none;
      font-weight: 600;
      color: var(--text-light);
      cursor: pointer;
      transition: 0.2s;
    }

    .tab-btn.active {
      color: var(--primary);
      border-bottom: 3px solid var(--primary);
      background: var(--card-bg);
    }

    .tab-content {
      display: none;
      padding: 20px;
      flex: 1;
    }

    .tab-content.active {
      display: block;
    }

    /* Cards e Saldos */
    .balance-card {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 10px 15px -3px rgba(37, 99, 235, 0.3);
    }

    .balance-card span {
      font-size: 0.9em;
      opacity: 0.9;
    }

    .balance-card h1 {
      margin: 5px 0 0 0;
      font-size: 2.2em;
    }

    .stat-card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 12px;
    }

    .stat-card span {
      font-size: 0.85em;
      color: var(--text-light);
    }

    .stat-card h2 {
      margin: 5px 0 0 0;
      font-size: 1.5em;
      color: var(--text);
    }

    /* Formulários e Botões */
    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 5px;
      font-size: 0.9em;
      color: var(--text-light);
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 1em;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      font-size: 1em;
      cursor: pointer;
      margin-bottom: 10px;
    }

    .btn-success { background: var(--success); color: white; }
    .btn-danger { background: var(--danger); color: white; }
    .btn-secondary { background: #e2e8f0; color: var(--text); }

    /* Listas */
    .history-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #f1f5f9;
    }

    .history-item:last-child { border-bottom: none; }

    .val-positive { color: var(--success); font-weight: bold; }
    .val-negative { color: var(--danger); font-weight: bold; }

    /* Modal Oculto */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: white;
      padding: 20px;
      border-radius: 12px;
      width: 90%;
      max-width: 400px;
      max-height: 80vh;
      overflow-y: auto;
    }
  </style>
</head>
<body>

<div class="app-container">
  <!-- Navegação das Abas -->
  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('principal')">Principal</button>
    <button class="tab-btn" onclick="switchTab('estatisticas')">Estatísticas</button>
  </div>

  <!-- ABA PRINCIPAL (Caixa/Banco) -->
  <div id="principal" class="tab-content active">
    <div class="balance-card">
      <span>Saldo em Caixa (Disponível)</span>
      <h1 id="saldo-caixa">R$ 0,00</h1>
    </div>

    <!-- Ações Rápidas -->
    <div class="form-group">
      <h3>Registrar Movimentação</h3>
      
      <!-- Entrada / Venda -->
      <div style="margin-bottom: 15px; border-bottom: 1px solid #eee; padding-bottom: 15px;">
        <label>Entrada (Venda Realizada)</label>
        <input type="number" id="qtd-jujubas" placeholder="Qtd. de jujubas" min="1" style="margin-bottom: 8px;">
        <input type="number" id="valor-entrada" placeholder="Valor recebido (R$)" step="0.01" style="margin-bottom: 8px;">
        <button class="btn btn-success" onclick="registrarEntrada()">+ Adicionar Entrada</button>
      </div>

      <!-- Saída / Gasto -->
      <div>
        <label>Saída (Gasto/Mercado)</label>
        <input type="text" id="desc-saida" placeholder="Descrição (ex: Mercado)" style="margin-bottom: 8px;">
        <input type="number" id="valor-saida" placeholder="Valor gasto (R$)" step="0.01" style="margin-bottom: 8px;">
        <button class="btn btn-danger" onclick="registrarSaida()">- Registrar Gasto</button>
      </div>
    </div>

    <button class="btn btn-secondary" onclick="toggleModal(true)" style="margin-top: 20px;">
      🔍 Ver Histórico Detalhado de Vendas
    </button>
  </div>

  <!-- ABA ESTATÍSTICAS -->
  <div id="estatisticas" class="tab-content">
    <div class="stat-card">
      <span>Total em Dinheiro Ganho (Acumulado)</span>
      <h2 id="total-ganho">R$ 0,00</h2>
    </div>

    <div class="stat-card">
      <span>Total de Jujubas Vendidas</span>
      <h2 id="total-jujubas">0 un.</h2>
    </div>

    <h3 style="margin-top: 25px;">Ganhos por Dia (Dinheiro Real)</h3>
    <ul class="history-list" id="lista-dias">
      <!-- Inserido dinamicamente pelo JS -->
    </ul>
  </div>
</div>

<!-- MODAL OCULTO: Histórico de Vendas Completo -->
<div class="modal" id="modal-historico">
  <div class="modal-content">
    <h3>Histórico de Vendas</h3>
    <ul class="history-list" id="lista-vendas-detalhada">
      <!-- Inserido dinamicamente pelo JS -->
    </ul>
    <button class="btn btn-secondary" onclick="toggleModal(false)" style="margin-top: 15px;">Fechar</button>
  </div>
</div>

<script>
  // Estado da aplicação
  let dados = {
    saldoCaixa: 0.00,
    totalGanho: 0.00,
    totalJujubas: 0,
    vendas: [], // { id, data, qtd, valor }
    saidas: [], // { id, data, descricao, valor }
    ganhosPorDia: {} // "AAAA-MM-DD": valor
  };

  // Funções de navegação de abas
  function switchTab(tabId) {
    document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    
    document.getElementById(tabId).classList.add('active');
    event.currentTarget.classList.add('active');
  }

  function toggleModal(show) {
    document.getElementById('modal-historico').style.display = show ? 'flex' : 'none';
  }

  // Utilitário de formatação
  function formatarMoeda(valor) {
    return valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
  }

  function obterDataAtual() {
    const hoje = new Date();
    return hoje.toISOString().split('T')[0]; // Formato YYYY-MM-DD
  }

  function formatarDataBR(dataISO) {
    const partes = dataISO.split('-');
    return `${partes[2]}/${partes[1]}/${partes[0]}`;
  }

  // Ações Financeiras
  function registrarEntrada() {
    const qtdInput = document.getElementById('qtd-jujubas');
    const valorInput = document.getElementById('valor-entrada');
    
    const qtd = parseInt(qtdInput.value) || 0;
    const valor = parseFloat(valorInput.value) || 0;

    if (valor <= 0) {
      alert('Informe um valor válido de entrada.');
      return;
    }

    const hoje = obterDataAtual();

    // Atualiza Saldos e Totais
    dados.saldoCaixa += valor;
    dados.totalGanho += valor;
    dados.totalJujubas += qtd;

    // Atualiza Histórico por Dia
    if (!dados.ganhosPorDia[hoje]) {
      dados.ganhosPorDia[hoje] = 0;
    }
    dados.ganhosPorDia[hoje] += valor;

    // Registra Venda Detalhada
    dados.vendas.unshift({
      id: Date.now(),
      data: new Date().toLocaleString('pt-BR'),
      qtd: qtd,
      valor: valor
    });

    // Limpa Inputs e Atualiza Interface
    qtdInput.value = '';
    valorInput.value = '';
    atualizarUI();
  }

  function registrarSaida() {
    const descInput = document.getElementById('desc-saida');
    const valorInput = document.getElementById('valor-saida');

    const desc = descInput.value.trim() || 'Gasto geral';
    const valor = parseFloat(valorInput.value) || 0;

    if (valor <= 0) {
      alert('Informe um valor válido de saída.');
      return;
    }

    // Deduz do Saldo em Caixa apenas (não diminui o Total Ganho)
    dados.saldoCaixa -= valor;

    dados.saidas.unshift({
      id: Date.now(),
      data: new Date().toLocaleString('pt-BR'),
      descricao: desc,
      valor: valor
    });

    descInput.value = '';
    valorInput.value = '';
    atualizarUI();
  }

  // Atualização da Interface do Usuário
  function atualizarUI() {
    // 1. Aba Principal
    document.getElementById('saldo-caixa').innerText = formatarMoeda(dados.saldoCaixa);

    // 2. Aba Estatísticas
    document.getElementById('total-ganho').innerText = formatarMoeda(dados.totalGanho);
    document.getElementById('total-jujubas').innerText = `${dados.totalJujubas} un.`;

    // Lista por Dias
    const listaDiasEl = document.getElementById('lista-dias');
    listaDiasEl.innerHTML = '';
    
    const diasOrdenados = Object.keys(dados.ganhosPorDia).sort().reverse();
    
    if (diasOrdenados.length === 0) {
      listaDiasEl.innerHTML = '<li class="history-item"><span style="color:var(--text-light)">Nenhum ganho registrado ainda.</span></li>';
    } else {
      diasOrdenados.forEach(diaISO => {
        const li = document.createElement('li');
        li.className = 'history-item';
        li.innerHTML = `
          <span>${formatarDataBR(diaISO)}</span>
          <span class="val-positive">+ ${formatarMoeda(dados.ganhosPorDia[diaISO])}</span>
        `;
        listaDiasEl.appendChild(li);
      });
    }

    // 3. Modal Detalhado de Vendas
    const listaVendasEl = document.getElementById('lista-vendas-detalhada');
    listaVendasEl.innerHTML = '';

    if (dados.vendas.length === 0) {
      listaVendasEl.innerHTML = '<li class="history-item"><span>Nenhuma venda registrada.</span></li>';
    } else {
      dados.vendas.forEach(venda => {
        const li = document.createElement('li');
        li.className = 'history-item';
        li.innerHTML = `
          <div>
            <strong>${venda.qtd}x Jujuba(s)</strong><br>
            <small style="color:var(--text-light)">${venda.data}</small>
          </div>
          <span class="val-positive">+ ${formatarMoeda(venda.valor)}</span>
        `;
        listaVendasEl.appendChild(li);
      });
    }
  }

  // Inicialização
  atualizarUI();
</script>

</body>
</html>
